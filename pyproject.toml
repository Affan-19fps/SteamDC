[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steamdc"
version = "0.1.0"
description = "Download Completion Shutdown for Steam — shuts down your PC when Steam downloads finish"
readme = "README.md"
license = { text = "MIT" }
keywords = ["steam", "shutdown", "download", "automation", "utility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2", "Pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/lowlevel-ad/SteamDC"
Repository = "https://github.com/lowlevel-ad/SteamDC"
Issues = "https://github.com/lowlevel-ad/SteamDC/issues"

[project.scripts]
steamdc = "steamdc.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["steamdc"]
omit = ["src/steamdc/ui_rich.py", "src/steamdc/ui_gui.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --no-header"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
